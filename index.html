  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const P = '#1B3E2D', PD = '#132B1F', ACC = '#E8A020', BG = '#F7F3EE', MUT = '#6B7280';

    const CATS = [
      { name:"Budaya", icon:"🏛️", count:128, desc:"Mengenal budaya Indonesia lebih dalam.", bg:"#FFF3E0" },
      { name:"Seni", icon:"🎨", count:96, desc:"Inspirasi seni untuk kehidupan lebih indah.", bg:"#F3E5F5" },
      { name:"Sosial", icon:"👥", count:142, desc:"Informasi sosial untuk masyarakat peduli.", bg:"#E3F2FD" },
      { name:"Pendidikan", icon:"🎓", count:212, desc:"Pengetahuan, tips, dan dunia pendidikan.", bg:"#E8F5E9" },
      { name:"Ekonomi", icon:"📈", count:98, desc:"Wawasan ekonomi hidup berkualitas.", bg:"#FFFDE7" },
      { name:"Kesehatan", icon:"💚", count:112, desc:"Tips kesehatan untuk hidup lebih baik.", bg:"#F1F8E9" },
      { name:"Teknologi", icon:"💻", count:87, desc:"Inovasi teknologi masa kini.", bg:"#E0F7FA" },
      { name:"Literasi Digital", icon:"📱", count:65, desc:"Panduan cerdas di era digital.", bg:"#FCE4EC" },
    ];

    const ARTS = [
      { id:1, title:"Membaca Buku di Era Digital: Tantangan dan Solusinya", cat:"Literasi Digital", author:"Rina Marlina", date:"12 Mei 2025", rt:4, views:2341, likes:187, trending:true,
        exc:"Di era digital yang serba cepat, kebiasaan membaca buku semakin tergerus. Bagaimana kita menyikapinya?",
        body:"Di era digital yang serba cepat dan penuh distraksi, kebiasaan membaca buku konvensional semakin tergerus oleh konten pendek berbasis media sosial seperti TikTok, Instagram Reels, dan YouTube Shorts.\n\nFenomena ini bukan tanpa alasan. Konten pendek dirancang secara algoritmik untuk memberikan dopamin instan, menciptakan siklus ketergantungan yang sulit diputus. Otak kita secara bertahap kehilangan kemampuan untuk fokus dalam jangka waktu panjang.\n\nNamun, membaca buku memiliki manfaat yang tidak bisa digantikan. Sebuah studi dari University of Sussex menunjukkan bahwa membaca selama 6 menit saja dapat mengurangi tingkat stres hingga 68%.\n\nBagaimana solusinya? Pertama, tetapkan waktu membaca harian minimal 20 menit. Kedua, gunakan aplikasi pemblokir media sosial saat sesi membaca. Ketiga, bergabunglah dengan komunitas baca seperti ReadUp untuk mendapatkan motivasi dan reward.\n\nDengan strategi yang tepat, kita bisa menjaga tradisi membaca di tengah gempuran era digital. Ingatlah: membaca adalah investasi terbaik untuk pikiran Anda." },
      { id:2, title:"5 Strategi Belajar Efektif untuk Generasi Z", cat:"Pendidikan", author:"Ahmad Fauzi", date:"10 Mei 2025", rt:3, views:1823, likes:145,
        exc:"Generasi Z memiliki cara belajar yang unik. Temukan strategi paling efektif untuk mereka.",
        body:"Generasi Z, mereka yang lahir antara 1997–2012, tumbuh besar dengan smartphone di tangan. Cara belajar mereka berbeda secara fundamental dari generasi sebelumnya.\n\nPertama, mereka lebih menyukai pembelajaran visual dan interaktif. Video penjelasan singkat, infografis, dan kuis interaktif jauh lebih efektif daripada teks panjang.\n\nKedua, Gen Z membutuhkan umpan balik yang cepat. Sistem gamifikasi—seperti yang diterapkan ReadUp—terbukti meningkatkan keterlibatan belajar hingga 48%.\n\nKetiga, belajar secara kolaboratif dalam kelompok kecil. Gen Z lebih produktif ketika mereka bisa berdiskusi dan berbagi perspektif.\n\nKeempat, sesi belajar pendek namun konsisten (Pomodoro Technique) lebih efektif daripada belajar maraton.\n\nKelima, kaitkan materi dengan konteks nyata. Gen Z belajar lebih baik ketika mereka memahami relevansi praktis dari apa yang dipelajari." },
      { id:3, title:"Batik Nusantara: Warisan Budaya yang Mendunia", cat:"Budaya", author:"Siti Rahayu", date:"8 Mei 2025", rt:5, views:3102, likes:256,
        exc:"Di balik setiap motif batik tersimpan filosofi mendalam tentang kehidupan masyarakat Indonesia.",
        body:"Batik telah diakui oleh UNESCO sebagai Warisan Kemanusiaan untuk Budaya Lisan dan Nonbendawi pada tahun 2009. Namun jauh sebelum pengakuan internasional itu, batik telah menjadi bagian tak terpisahkan dari kehidupan masyarakat Jawa dan Nusantara.\n\nSetiap motif batik memiliki makna filosofis yang dalam. Motif Parang melambangkan keberanian dan semangat juang yang tidak pernah padam. Motif Kawung mewakili kemurnian dan kesempurnaan.\n\nProses pembuatan batik tulis yang memakan waktu berhari-hari mencerminkan nilai kesabaran dan ketelitian yang dijunjung tinggi dalam budaya Jawa.\n\nKini, batik tidak hanya hadir dalam bentuk kain tradisional. Para desainer muda Indonesia berhasil mengintegrasikan motif batik ke dalam fashion kontemporer, streetwear, bahkan desain interior modern.\n\nInilah bukti bahwa warisan budaya tidak harus kaku—ia bisa terus berkembang dan relevan menembus batas zaman." },
      { id:4, title:"Investasi Saham untuk Pemula: Mulai dari Mana?", cat:"Ekonomi", author:"Budi Santoso", date:"7 Mei 2025", rt:6, views:4201, likes:389, trending:true,
        exc:"Panduan lengkap untuk anak muda yang ingin mulai investasi saham dari nol.",
        body:"Investasi saham sering kali terasa menakutkan bagi pemula. Namun dengan pemahaman yang tepat, siapa pun bisa memulainya.\n\nLangkah pertama adalah membuka rekening efek. Pilihlah sekuritas yang terdaftar di OJK dan memiliki aplikasi yang user-friendly seperti Ajaib, Bibit, atau Stockbit.\n\nLangkah kedua, pelajari konsep dasar: saham adalah kepemilikan sebagian kecil dari sebuah perusahaan. Ketika perusahaan untung, nilai saham cenderung naik.\n\nLangkah ketiga, mulailah dengan perusahaan yang Anda kenal. Familiar dengan produk membantu Anda memahami prospek bisnis.\n\nLangkah keempat, diversifikasi portofolio. Jangan taruh semua telur dalam satu keranjang.\n\nLangkah kelima dan terpenting: investasikan hanya uang yang tidak Anda butuhkan dalam jangka pendek. Saham adalah investasi jangka panjang." },
      { id:5, title:"Kesehatan Mental di Tempat Kerja: Kenali Tandanya", cat:"Kesehatan", author:"dr. Maya Putri", date:"5 Mei 2025", rt:4, views:2890, likes:234,
        exc:"Burnout dan stres kerja semakin marak. Kenali tanda-tanda gangguan mental sebelum terlambat.",
        body:"Kesehatan mental di tempat kerja menjadi isu yang semakin kritis. Survei terbaru menunjukkan bahwa 1 dari 3 pekerja di Indonesia pernah mengalami burnout setidaknya sekali dalam karir mereka.\n\nTanda-tanda burnout yang perlu diwaspadai: merasa lelah ekstrem meskipun sudah cukup istirahat, kehilangan motivasi dan antusiasme, mudah tersinggung atau emosional, penurunan produktivitas yang signifikan, dan sering sakit kepala atau gangguan fisik lainnya.\n\nJika Anda mengalami gejala-gejala di atas, jangan abaikan. Berbicara dengan atasan atau HR tentang beban kerja Anda adalah langkah awal yang tepat.\n\nPerusahaan-perusahaan progresif kini menyediakan fasilitas konseling psikologis gratis dan kebijakan work-life balance yang lebih sehat.\n\nIngat: merawat kesehatan mental sama pentingnya dengan menjaga kesehatan fisik." },
      { id:6, title:"AI dan Masa Depan Pekerjaan: Peluang atau Ancaman?", cat:"Teknologi", author:"Rizky Pratama", date:"3 Mei 2025", rt:5, views:5678, likes:412, trending:true,
        exc:"Kecerdasan buatan mengubah dunia kerja. Peluang atau ancaman bagi tenaga kerja?",
        body:"Revolusi kecerdasan buatan (AI) tengah mengubah peta dunia kerja secara fundamental. McKinsey memperkirakan hingga 375 juta pekerja global mungkin perlu beralih karir pada 2030 karena otomasi.\n\nNamun, narasi 'AI akan mencuri pekerjaan Anda' terlalu simplistis. Sejarah revolusi industri mengajarkan bahwa teknologi baru memang menghilangkan beberapa jenis pekerjaan, tetapi selalu menciptakan lebih banyak pekerjaan baru.\n\nPekerjaan yang paling rentan terhadap AI adalah yang bersifat repetitif dan berbasis aturan: operator data entry, kasir, dan beberapa peran akuntansi dasar.\n\nSebaliknya, pekerjaan yang membutuhkan kreativitas, empati, dan pemikiran kritis justru akan semakin bernilai. AI tidak bisa menggantikan seorang terapis yang benar-benar mendengarkan atau seorang guru yang menginspirasi.\n\nKesimpulannya: AI bukan ancaman bagi mereka yang mau beradaptasi. Investasikan waktu untuk mengembangkan keterampilan human-centric dan belajar berkolaborasi dengan AI sebagai alat bantu." },
    ];

    const REWARDS = [
      { id:1, name:"Kaos ReadUp", pts:2500, stock:50, cat:"Merchandise", em:"👕" },
      { id:2, name:"Tumbler Premium", pts:2000, stock:30, cat:"Merchandise", em:"🥤" },
      { id:3, name:"Topi ReadUp", pts:1800, stock:40, cat:"Merchandise", em:"🧢" },

      { id:6, name:"Voucher Pulsa Rp 25.000", pts:3000, stock:200, cat:"Voucher", em:"📱", val:"25.000", vc:'#E74C3C' },
      { id:7, name:"Voucher GoPay Rp 30.000", pts:3500, stock:150, cat:"E-Wallet", em:"💳", val:"30.000", vc:'#00B14F' },
      { id:8, name:"Buku 'Atomic Habits'", pts:4000, stock:20, cat:"Buku", em:"📚" },
      { id:9, name:"Notebook Premium", pts:1500, stock:60, cat:"Merchandise", em:"📓" },
      { id:10, name:"Voucher OVO Rp 20.000", pts:2500, stock:100, cat:"E-Wallet", em:"💰", val:"20.000", vc:'#4C3494' },
    ];

    const PROGS = [
      { name:"Program Donasi Reward", desc:"Donasi poin Anda untuk dukung literasi Indonesia.", icon:"⭐", color:"#E74C3C" },
      { name:"Donasi Literasi", desc:"Donasi untuk mendukung pendidikan dan budaya baca.", icon:"📚", color:"#E8A020" },
      { name:"Program Sekolah & Komunitas", desc:"Bersama sekolah dan komunitas membangun budaya baca.", icon:"🏫", color:"#3498DB" },
      { name:"Event & Pelatihan", desc:"Ikuti event dan pelatihan literasi untuk berkembang bersama.", icon:"🎯", color:"#2ECC71" },

    const BASE_HISTORY = [

      { act:"Referral teman: Dina bergabung", pts:20, date:"Kemarin, 15:30" },
      { act:"Tukar poin: Voucher Pulsa Rp 25.000", pts:-3000, date:"2 hari lalu" },

      { act:"Publikasi artikel baru", pts:50, date:"5 hari lalu" },

    const catIcon = c => ({ 'Literasi Digital':'📱', Pendidikan:'🎓', Budaya:'🏛️', Ekonomi:'📈', Kesehatan:'💚', Teknologi:'💻', Seni:'🎨', Sosial:'👥' }[c] || '📄');

    function Notif({ n }) {
      return (
        <div style={{ position:'fixed', top:76, right:20, zIndex:9999, background: n.type==='error'?'#E74C3C':P,
          color:'#fff', padding:'12px 20px', borderRadius:12, boxShadow:'0 4px 24px rgba(0,0,0,0.25)',
          display:'flex', alignItems:'center', gap:10, maxWidth:340, fontSize:14, fontWeight:600,
          animation:'fadeSlide .3s ease' }}>
          <span>{n.type==='error'?'❌':'✅'}</span>{n.msg}
        </div>
      );
    }

    function NavBar({ pg, go, pts }) {
      const links = [
        {id:'home',lbl:'Beranda'},{id:'articles',lbl:'Artikel'},
        {id:'programs',lbl:'Program'},{id:'donate',lbl:'Donasi'},{id:'rewards',lbl:'Reward Store'}
      ];
      return (
        <nav style={{ background:P, position:'sticky', top:0, zIndex:200, height:64,
          display:'flex', alignItems:'center', padding:'0 32px', gap:8, boxShadow:'0 2px 12px rgba(0,0,0,.25)' }}>
          <div onClick={()=>go('home')} style={{ display:'flex', alignItems:'center', gap:8,
            cursor:'pointer', color:'#fff', fontWeight:900, fontSize:20, marginRight:24, flexShrink:0 }}>
            📖 ReadUp
          </div>
          <div style={{ display:'flex', flex:1, gap:2 }}>
            {links.map(l=>(
              <button key={l.id} onClick={()=>go(l.id)} style={{ background:'none', border:'none',
                color: pg===l.id?'#fff':'rgba(255,255,255,.65)', padding:'8px 12px', borderRadius:8,
                cursor:'pointer', fontSize:13, fontWeight: pg===l.id?700:400,
                borderBottom: pg===l.id?'2px solid #fff':'2px solid transparent' }}>{l.lbl}</button>
            ))}
          </div>
          <div style={{ display:'flex', alignItems:'center', background:'rgba(255,255,255,.13)',
            borderRadius:20, padding:'6px 14px', gap:6, marginRight:12 }}>
            <span style={{ color:'rgba(255,255,255,.7)', fontSize:13 }}>🔍</span>
            <input placeholder="Cari artikel..." style={{ background:'none', border:'none', outline:'none',
              color:'#fff', fontSize:12, width:120 }} />
          </div>
          <button style={{ background:'none', border:'none', color:'#fff', fontSize:20, cursor:'pointer', marginRight:8 }}>🔔</button>
          <div onClick={()=>go('dashboard')} style={{ display:'flex', alignItems:'center', gap:8,
            background:'rgba(255,255,255,.15)', borderRadius:20, padding:'6px 14px', cursor:'pointer' }}>
            <div style={{ width:32, height:32, borderRadius:'50%', background:ACC,
              display:'flex', alignItems:'center', justifyContent:'center', fontSize:14 }}>👤</div>
            <div>
              <div style={{ color:'#fff', fontSize:12, fontWeight:700 }}>Hai, Budi</div>
              <div style={{ color:ACC, fontSize:11, fontWeight:800 }}>🪙 {pts.toLocaleString('id')} Poin</div>
            </div>
          </div>
        </nav>
      );
    }

    function Section({ title, onMore, children, mt=0, small=false }) {
      return (
        <div style={{ marginTop:mt }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16 }}>
            <h2 style={{ margin:0, fontSize: small?17:20, fontWeight:800 }}>{title}</h2>
            {onMore && <button onClick={onMore} style={{ background:'none', border:'1px solid #ccc',
              padding:'5px 14px', borderRadius:20, cursor:'pointer', fontSize:12, color:MUT }}>Lihat Semua</button>}
          </div>
          {children}
        </div>
      );
    }

    function Tag({ label, bg, pos }) {
      return (
        <div style={{ position:'absolute', ...pos, background:bg, color:'#fff',
          fontSize:10, padding:'3px 8px', borderRadius:20, fontWeight:700 }}>{label}</div>
      );
    }

    function HomePage({ go, pts }) {
      return (
        <div style={{ background:BG }}>
          <div style={{ background:`linear-gradient(135deg, ${P} 0%, #2D5A40 100%)`, padding:'56px 48px 40px' }}>
            <div style={{ display:'flex', alignItems:'center', gap:32, maxWidth:1200, margin:'0 auto' }}>
              <div style={{ flex:1.4 }}>
                <h1 style={{ color:'#fff', fontSize:52, fontWeight:900, lineHeight:1.1, margin:'0 0 16px' }}>
                  Read up to<br/>rise up
                </h1>
                <p style={{ color:'rgba(255,255,255,.8)', fontSize:15, maxWidth:420, lineHeight:1.7, margin:'0 0 28px' }}>
                  Baca artikel berkualitas di ReadUp dan kumpulkan poin untuk ditukarkan dengan berbagai reward menarik. Bersama ReadUp, ciptakan budaya literasi Indonesia.
                </p>
                <div style={{ display:'flex', gap:12 }}>
                  <button onClick={()=>go('articles')} style={{ background:'#fff', color:P, border:'none',
                    padding:'12px 24px', borderRadius:8, fontWeight:800, cursor:'pointer', fontSize:14 }}>
                    📖 Mulai Membaca
                  </button>
                  <button onClick={()=>go('programs')} style={{ background:'transparent', color:'#fff',
                    border:'2px solid rgba(255,255,255,.45)', padding:'12px 24px', borderRadius:8,
                    fontWeight:600, cursor:'pointer', fontSize:14 }}>
                    Lihat Program
                  </button>
                </div>
              </div>
              <div style={{ flex:1, display:'flex', justifyContent:'center', alignItems:'center' }}>
                <div style={{ position:'relative', textAlign:'center' }}>
                  <div style={{ fontSize:110, lineHeight:1, filter:'drop-shadow(0 12px 32px rgba(0,0,0,.3))' }}>🧑‍💻</div>
                  <div style={{ position:'absolute', top:-10, right:-20, background:ACC,
                    color:'#fff', borderRadius:12, padding:'6px 12px', fontSize:12, fontWeight:800 }}>+5 Poin! 🎉</div>
                </div>
              </div>
              <div style={{ background:PD, borderRadius:16, padding:28, minWidth:248, flexShrink:0,
                boxShadow:'0 8px 32px rgba(0,0,0,.35)' }}>
                <div style={{ color:'rgba(255,255,255,.65)', fontSize:13, marginBottom:8 }}>Poin Anda</div>
                <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:6 }}>
                  <span style={{ fontSize:30 }}>🪙</span>
                  <span style={{ color:'#fff', fontSize:38, fontWeight:900 }}>{pts.toLocaleString('id')}</span>
                </div>
                <div style={{ color:'rgba(255,255,255,.55)', fontSize:12, marginBottom:20, lineHeight:1.5 }}>
                  Terus membaca untuk kumpulkan lebih banyak poin!
                </div>
                <button onClick={()=>go('dashboard')} style={{ background:'rgba(255,255,255,.13)',
                  border:'1px solid rgba(255,255,255,.2)', color:'#fff', padding:'10px 16px',
                  borderRadius:8, cursor:'pointer', fontSize:13, width:'100%', fontWeight:600 }}>
                  🔄 Riwayat Poin
                </button>
              </div>
            </div>
          </div>

          <div style={{ padding:'36px 48px', maxWidth:1200, margin:'0 auto',
            display:'grid', gridTemplateColumns:'1fr 284px', gap:32 }}>
            <div>
              <Section title="Kategori Artikel" onMore={()=>go('articles')}>
                <div style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:12 }}>
                  {CATS.slice(0,6).map(c=>(
                    <div key={c.name} onClick={()=>go('articles')} style={{ background:c.bg, borderRadius:12,
                      padding:16, cursor:'pointer', border:'1px solid rgba(0,0,0,.05)' }}>
                      <div style={{ fontSize:28, marginBottom:8 }}>{c.icon}</div>
                      <div style={{ fontWeight:700, fontSize:14, marginBottom:4 }}>{c.name}</div>
                      <div style={{ fontSize:11, color:MUT, lineHeight:1.4, marginBottom:8 }}>{c.desc}</div>
                      <div style={{ fontSize:11, color:MUT, fontWeight:600 }}>{c.count} Artikel</div>
                    </div>
                  ))}

              </Section>

              <Section title="Marketplace Reward" onMore={()=>go('rewards')} mt={36}>
                <div style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:12 }}>
                  {REWARDS.slice(0,6).map(r=>(
                    <div key={r.id} onClick={()=>go('rewards')} style={{ background:'#fff', borderRadius:12,
                      overflow:'hidden', cursor:'pointer', border:'1px solid rgba(0,0,0,.06)' }}>
                      <div style={{ background: r.val ? r.vc+'18' : '#f5f5f5', height:100,
                        display:'flex', alignItems:'center', justifyContent:'center' }}>
                        {r.val

                              padding:'10px 14px', textAlign:'center' }}>
                              <div style={{ fontSize:9, fontWeight:700 }}>VOUCHER</div>
                              <div style={{ fontSize:16, fontWeight:900 }}>Rp {r.val}</div>
                            </div>
                          : <span style={{ fontSize:44 }}>{r.em}</span>}
                      </div>
                      <div style={{ padding:'10px 12px' }}>
                        <div style={{ fontSize:12, fontWeight:600, marginBottom:4, lineHeight:1.3 }}>{r.name}</div>
                        <div style={{ fontSize:12, color:ACC, fontWeight:800 }}>🪙 {r.pts.toLocaleString('id')}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </Section>
            </div>

            <div>
              <Section title="Program" small onMore={()=>go('programs')}>
                {PROGS.map(pr=>(
                  <div key={pr.name} style={{ background:'#fff', borderRadius:12, padding:14,
                    marginBottom:10, display:'flex', alignItems:'center', gap:12,
                    cursor:'pointer', border:'1px solid rgba(0,0,0,.05)' }}>
                    <div style={{ width:40, height:40, borderRadius:10, background:pr.color+'22',
                      display:'flex', alignItems:'center', justifyContent:'center', fontSize:18, flexShrink:0 }}>{pr.icon}</div>
                    <div style={{ flex:1 }}>
                      <div style={{ fontWeight:700, fontSize:13, marginBottom:2 }}>{pr.name}</div>
                      <div style={{ fontSize:11, color:MUT, lineHeight:1.4 }}>{pr.desc}</div>

                    <span style={{ color:MUT, fontSize:16 }}>›</span>

                padding:24, marginTop:20, textAlign:'center' }}>
                <div style={{ fontSize:36, marginBottom:10 }}>🎁</div>
                <p style={{ color:'rgba(255,255,255,.9)', fontSize:12, lineHeight:1.6, marginBottom:18 }}>

                  padding:'11px', borderRadius:8, fontWeight:800, cursor:'pointer', fontSize:13, width:'100%' }}>
                  Kunjungi Reward Store

          </div>

          <div style={{ background:'#fff', padding:'24px 48px',
            display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:24,
            borderTop:'1px solid rgba(0,0,0,.06)' }}>
            {[
              {icon:'📄', t:'Baca Artikel', d:'Temukan artikel menarik dan berkualitas setiap hari'},
              {icon:'⭐', t:'Kumpulkan Poin', d:'Dapatkan poin dari setiap aktivitas membaca dan berpartisipasi'},
              {icon:'🎁', t:'Tukarkan Reward', d:'Tukar poin Anda dengan berbagai hadiah menarik'},
              {icon:'🌍', t:'Berbagi Manfaat', d:'Donasi poin untuk gerakan literasi Indonesia'},
            ].map(f=>(
              <div key={f.t} style={{ display:'flex', alignItems:'flex-start', gap:12 }}>
                <div style={{ width:44, height:44, borderRadius:12, background:P+'18',
                  display:'flex', alignItems:'center', justifyContent:'center', fontSize:20, flexShrink:0 }}>{f.icon}</div>
                <div>
                  <div style={{ fontWeight:700, fontSize:13, marginBottom:4 }}>{f.t}</div>
                  <div style={{ fontSize:12, color:MUT, lineHeight:1.5 }}>{f.d}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function ArtCard({ a, go, setArt, isRead }) {
      return (
        <div onClick={()=>{ setArt(a); go('article'); }} style={{ background:'#fff', borderRadius:16,
          overflow:'hidden', cursor:'pointer', border:'1px solid rgba(0,0,0,.06)',
          boxShadow:'0 2px 8px rgba(0,0,0,.05)' }}>
          <div style={{ background:`linear-gradient(135deg, ${P}CC, #2D5A40CC)`, height:136,
            display:'flex', alignItems:'center', justifyContent:'center', position:'relative' }}>
            <span style={{ fontSize:52 }}>{catIcon(a.cat)}</span>
            {a.trending && <Tag label="🔥 Trending" bg="#E74C3C" pos={{ top:10, right:10 }} />}
            {isRead && <Tag label="✓ Dibaca" bg="#27AE60" pos={{ top:10, left:10 }} />}
          </div>
          <div style={{ padding:16 }}>
            <div style={{ background:P+'18', color:P, fontSize:10, fontWeight:700,
              padding:'3px 10px', borderRadius:20, display:'inline-block', marginBottom:8 }}>{a.cat}</div>
            <h3 style={{ fontSize:14, fontWeight:700, margin:'0 0 8px', lineHeight:1.4 }}>{a.title}</h3>
            <p style={{ fontSize:12, color:MUT, lineHeight:1.5, margin:'0 0 12px' }}>{a.exc}</p>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <span style={{ fontSize:11, color:MUT }}>{a.author} · {a.rt} mnt</span>
              <span style={{ background:ACC+'22', color:ACC, fontSize:11, fontWeight:800,
                padding:'3px 10px', borderRadius:20 }}>+5 poin</span>
            </div>
            <div style={{ display:'flex', gap:14, marginTop:10, paddingTop:10,
              borderTop:'1px solid rgba(0,0,0,.06)', fontSize:11, color:MUT }}>
              <span>👁️ {a.views.toLocaleString('id')}</span>
              <span>❤️ {a.likes}</span>
              <span>📅 {a.date}</span>
            </div>
          </div>
        </div>
      );
    }

    function ArticlesPage({ go, setArt, readSet }) {
      const [filter, setFilter] = useState('Semua');
      const allCats = ['Semua', ...new Set(ARTS.map(a=>a.cat))];
      const shown = filter==='Semua' ? ARTS : ARTS.filter(a=>a.cat===filter);
      return (
        <div style={{ background:BG, minHeight:'100vh', padding:'40px 48px' }}>
          <div style={{ maxWidth:1200, margin:'0 auto' }}>
            <h1 style={{ fontSize:28, fontWeight:900, marginBottom:6 }}>Artikel</h1>
            <p style={{ color:MUT, marginBottom:24 }}>Temukan artikel berkualitas dan kumpulkan poin membaca</p>
            <div style={{ display:'flex', gap:8, marginBottom:32, flexWrap:'wrap' }}>
              {allCats.map(c=>(
                <button key={c} onClick={()=>setFilter(c)} style={{
                  background: filter===c?P:'#fff', color: filter===c?'#fff':MUT,
                  border:`1px solid ${filter===c?P:'#ddd'}`, padding:'7px 16px',
                  borderRadius:20, cursor:'pointer', fontSize:13, fontWeight:600 }}>{c}</button>
              ))}
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:20 }}>
              {shown.map(a=><ArtCard key={a.id} a={a} go={go} setArt={setArt} isRead={readSet.has(a.id)} />)}
            </div>
          </div>
        </div>
      );
    }

    function ArticlePage({ art, readSet, setReadSet, earn, streak, setStreak, go }) {
      const [timer, setTimer] = useState(0);
      const [earned, setEarned] = useState(readSet.has(art.id));
      const [liked, setLiked] = useState(false);
      const [saved, setSaved] = useState(false);
      const TARGET = 45;
      const ref = useRef();

      useEffect(() => { setTimer(0); setEarned(readSet.has(art.id)); }, [art.id]);

      useEffect(() => {
        if (earned) return;
        ref.current = setInterval(() => {
          setTimer(t => {
            if (t >= TARGET - 1) {
              clearInterval(ref.current);
              setReadSet(prev => new Set([...prev, art.id]));
              setEarned(true);
              earn(5, 'Selesai membaca artikel!');
              const ns = streak + 1;
              setStreak(ns);
              if (ns > 0 && ns % 3 === 0) setTimeout(() => earn(10, 'Bonus streak baca 3 artikel!'), 1200);
              return TARGET;
            }
            return t + 1;
          });
        }, 1000);
        return () => clearInterval(ref.current);
      }, [earned, art.id]);

      const pct = Math.min((timer / TARGET) * 100, 100);

      return (
        <div style={{ background:BG, minHeight:'100vh' }}>
          <div style={{ position:'sticky', top:64, zIndex:100, background:'#fff',
            borderBottom:'1px solid rgba(0,0,0,.07)' }}>
            <div style={{ height:4, background:'#eee' }}>
              <div style={{ height:'100%', width:`${pct}%`, transition:'width 1s linear',
                background: earned ? '#27AE60' : ACC, borderRadius:'0 4px 4px 0' }} />
            </div>
            <div style={{ padding:'7px 48px', display:'flex', justifyContent:'space-between',
              alignItems:'center', fontSize:12, color:MUT }}>
              <span>⏱️ {earned ? 'Selesai dibaca ✅' : `${Math.round(pct)}% terbaca`}</span>
              {earned
                ? <span style={{ color:'#27AE60', fontWeight:700 }}>🎉 +5 poin telah dikreditkan!</span>
                : <span>📖 Baca {TARGET - timer} detik lagi untuk mendapat poin</span>}
            </div>
          </div>
          <div style={{ maxWidth:740, margin:'0 auto', padding:'36px 24px' }}>
            <button onClick={()=>go('articles')} style={{ background:'none', border:'1px solid #ddd',
              padding:'7px 16px', borderRadius:8, cursor:'pointer', fontSize:13, marginBottom:24, color:MUT }}>
              ← Kembali ke Artikel
            </button>
            <div style={{ background:P+'18', color:P, fontSize:11, fontWeight:700,
              padding:'4px 12px', borderRadius:20, display:'inline-block', marginBottom:14 }}>{art.cat}</div>
            <h1 style={{ fontSize:30, fontWeight:900, margin:'0 0 16px', lineHeight:1.3 }}>{art.title}</h1>
            <div style={{ display:'flex', flexWrap:'wrap', gap:14, fontSize:13, color:MUT,
              marginBottom:24, paddingBottom:24, borderBottom:'1px solid rgba(0,0,0,.08)' }}>
              <span>✍️ {art.author}</span><span>📅 {art.date}</span>
              <span>⏱️ {art.rt} mnt baca</span><span>👁️ {art.views.toLocaleString('id')}</span>
            </div>
            <div style={{ lineHeight:1.85, fontSize:16, color:'#2a2a2a' }}>
              {art.body.split('\n\n').map((p,i)=><p key={i} style={{ marginBottom:22 }}>{p}</p>)}
            </div>
            <div style={{ display:'flex', gap:10, marginTop:32, paddingTop:24,
              borderTop:'1px solid rgba(0,0,0,.08)', flexWrap:'wrap' }}>
              {[
                { icon: liked?'❤️':'🤍', lbl:`${art.likes+(liked?1:0)} Like`, act:()=>setLiked(l=>!l) },
                { icon:'🔖', lbl: saved?'Tersimpan':'Simpan', act:()=>setSaved(s=>!s) },
                { icon:'💬', lbl:'Komentar', act:()=>{} },
                { icon:'📤', lbl:'Bagikan', act:()=>{} },
              ].map(b=>(
                <button key={b.lbl} onClick={b.act} style={{ display:'flex', alignItems:'center', gap:6,
                  background:'#fff', border:'1px solid #ddd', padding:'9px 18px', borderRadius:8,
                  cursor:'pointer', fontSize:13, color:'#333', fontWeight:500 }}>
                  {b.icon} {b.lbl}
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function RewardsPage({ pts, redeem, redeemed }) {
      const [filter, setFilter] = useState('Semua');
      const cats = ['Semua', 'Merchandise', 'Voucher', 'E-Wallet', 'Buku'];
      const shown = filter==='Semua' ? REWARDS : REWARDS.filter(r=>r.cat===filter);
      return (
        <div style={{ background:BG, minHeight:'100vh' }}>
          <div style={{ background:`linear-gradient(135deg, ${P}, #2D5A40)`, padding:'40px 48px' }}>
            <div style={{ maxWidth:1200, margin:'0 auto' }}>
              <h1 style={{ color:'#fff', fontSize:28, fontWeight:900, margin:'0 0 6px' }}>🎁 Reward Store</h1>
              <p style={{ color:'rgba(255,255,255,.75)', margin:'0 0 20px' }}>Tukar poin Anda dengan reward pilihan</p>
              <div style={{ background:'rgba(255,255,255,.15)', borderRadius:12, padding:'14px 22px',
                display:'inline-flex', alignItems:'center', gap:12 }}>
                <span style={{ fontSize:24 }}>🪙</span>
                <div>
                  <div style={{ color:'rgba(255,255,255,.75)', fontSize:12 }}>Poin Anda saat ini</div>
                  <div style={{ color:'#fff', fontSize:26, fontWeight:900 }}>{pts.toLocaleString('id')} Poin</div>
                </div>
              </div>
            </div>
          </div>
          <div style={{ padding:'32px 48px', maxWidth:1200, margin:'0 auto' }}>
            <div style={{ display:'flex', gap:8, marginBottom:28 }}>
              {cats.map(c=>(
                <button key={c} onClick={()=>setFilter(c)} style={{
                  background: filter===c?P:'#fff', color: filter===c?'#fff':MUT,
                  border:`1px solid ${filter===c?P:'#ddd'}`, padding:'7px 16px',
                  borderRadius:20, cursor:'pointer', fontSize:13, fontWeight:600 }}>{c}</button>
              ))}
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:16 }}>
              {shown.map(r=>{
                const done = redeemed.some(x=>x.id===r.id);
                const ok = pts >= r.pts;
                return (
                  <div key={r.id} style={{ background:'#fff', borderRadius:16, overflow:'hidden',
                    border:'1px solid rgba(0,0,0,.06)', boxShadow:'0 2px 8px rgba(0,0,0,.04)',
                    opacity: done?.65:1 }}>
                    <div style={{ background: r.val ? r.vc+'14' : '#f6f6f6', height:120,
                      display:'flex', alignItems:'center', justifyContent:'center' }}>
                      {r.val
                        ? <div style={{ background:r.vc, color:'#fff', borderRadius:10,
                            padding:'10px 18px', textAlign:'center' }}>
                            <div style={{ fontSize:9, fontWeight:700 }}>VOUCHER</div>
                            <div style={{ fontSize:20, fontWeight:900 }}>Rp {r.val}</div>
                          </div>
                        : <span style={{ fontSize:50 }}>{r.em}</span>}
                    </div>
                    <div style={{ padding:14 }}>
                      <div style={{ fontSize:12, fontWeight:700, marginBottom:4, lineHeight:1.3 }}>{r.name}</div>
                      <div style={{ fontSize:11, color:MUT, marginBottom:10 }}>Stok: {r.stock}</div>
                      <div style={{ color:ACC, fontWeight:900, fontSize:14, marginBottom:12 }}>🪙 {r.pts.toLocaleString('id')}</div>
                      <button onClick={()=>!done&&redeem(r)} style={{
                        width:'100%', padding:'9px', borderRadius:8, border:'none',
                        background: done?'#e0e0e0':ok?P:'#FDECEA',
                        color: done?'#888':ok?'#fff':'#E74C3C',
                        fontWeight:700, cursor: done?'not-allowed':'pointer', fontSize:13 }}>
                        {done?'✓ Ditukarkan':ok?'Tukar Sekarang':'⚠️ Poin Kurang'}
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    function DashboardPage({ pts, readSet, redeemed, history }) {
      const lvl = pts < 500?'Bronze':pts < 1500?'Silver':pts < 3000?'Gold':'Platinum';
      const lvlColor = { Bronze:'#CD7F32', Silver:'#9E9E9E', Gold:'#F4C430', Platinum:'#8E8E8E' }[lvl];
      const lvlIcon = { Bronze:'🥉', Silver:'🥈', Gold:'🥇', Platinum:'💎' }[lvl];
      const nextPts = { Bronze:500, Silver:1500, Gold:3000, Platinum:Infinity }[lvl];
      const pct = lvl==='Platinum'?100:Math.min((pts/nextPts)*100,100);
      const allHist = [...history, ...redeemed.map(r=>({act:`Tukar poin: ${r.name}`, pts:-r.pts, date:'Baru saja'}))];
      return (
        <div style={{ background:BG, minHeight:'100vh', padding:'40px 48px' }}>
          <div style={{ maxWidth:1200, margin:'0 auto', display:'grid', gridTemplateColumns:'300px 1fr', gap:24 }}>
            <div>
              <div style={{ background:`linear-gradient(135deg, ${P}, #2D5A40)`,
                borderRadius:16, padding:28, textAlign:'center', marginBottom:16 }}>
                <div style={{ width:72, height:72, borderRadius:'50%', background:lvlColor,
                  display:'flex', alignItems:'center', justifyContent:'center',
                  fontSize:32, margin:'0 auto 12px' }}>👤</div>
                <div style={{ color:'#fff', fontWeight:800, fontSize:18 }}>Budi Santoso</div>
                <div style={{ color:'rgba(255,255,255,.6)', fontSize:12, margin:'4px 0 14px' }}>budi@email.com</div>
                <div style={{ background:lvlColor, borderRadius:20, padding:'4px 16px',
                  display:'inline-block', fontWeight:800, fontSize:12, color:'#fff', marginBottom:20 }}>
                  {lvlIcon} {lvl}
                </div>
                <div style={{ background:'rgba(0,0,0,.2)', borderRadius:12, padding:16 }}>
                  <div style={{ color:'rgba(255,255,255,.7)', fontSize:12, marginBottom:4 }}>Total Poin</div>
                  <div style={{ color:'#fff', fontSize:30, fontWeight:900 }}>🪙 {pts.toLocaleString('id')}</div>
                </div>
              </div>
              <div style={{ background:'#fff', borderRadius:16, padding:20, marginBottom:16, border:'1px solid rgba(0,0,0,.06)' }}>
                <div style={{ fontWeight:700, marginBottom:12, fontSize:14 }}>Progress Level</div>
                <div style={{ display:'flex', justifyContent:'space-between', fontSize:12, color:MUT, marginBottom:8 }}>
                  <span>{lvl}</span>
                  <span>{lvl==='Platinum'?'MAX':nextPts.toLocaleString('id')+' poin'}</span>
                </div>
                <div style={{ background:'#eee', borderRadius:20, height:10, overflow:'hidden' }}>
                  <div style={{ width:`${pct}%`, height:'100%', background:lvlColor, borderRadius:20 }} />
                </div>
                <div style={{ fontSize:11, color:MUT, marginTop:8 }}>
                  {lvl==='Platinum'?'🏆 Level tertinggi!':`${(nextPts-pts).toLocaleString('id')} poin lagi ke level berikutnya`}
                </div>
              </div>
              <div style={{ background:'#fff', borderRadius:16, padding:20, border:'1px solid rgba(0,0,0,.06)' }}>
                <div style={{ fontWeight:700, marginBottom:14, fontSize:14 }}>Statistik Anda</div>
                {[
                  {lbl:'Artikel Dibaca', val:readSet.size, icon:'📖'},
                  {lbl:'Reward Ditukar', val:redeemed.length, icon:'🎁'},
                  {lbl:'Total Poin Aktif', val:pts.toLocaleString('id'), icon:'⭐'},
                ].map(s=>(
                  <div key={s.lbl} style={{ display:'flex', justifyContent:'space-between', alignItems:'center',
                    padding:'10px 0', borderBottom:'1px solid rgba(0,0,0,.06)' }}>
                    <span style={{ fontSize:13, color:MUT }}>{s.icon} {s.lbl}</span>
                    <span style={{ fontWeight:800, color:P }}>{s.val}</span>
                  </div>
                ))}
              </div>
            </div>
            <div>
              <div style={{ background:'#fff', borderRadius:16, padding:24, border:'1px solid rgba(0,0,0,.06)', marginBottom:20 }}>
                <h2 style={{ margin:'0 0 20px', fontSize:18, fontWeight:800 }}>Riwayat Poin</h2>
                {allHist.map((h,i)=>(
                  <div key={i} style={{ display:'flex', justifyContent:'space-between', alignItems:'center',
                    padding:'13px 0', borderBottom: i<allHist.length-1?'1px solid rgba(0,0,0,.06)':'none' }}>
                    <div>
                      <div style={{ fontSize:13, fontWeight:500, marginBottom:3 }}>{h.act}</div>
                      <div style={{ fontSize:11, color:MUT }}>{h.date}</div>
                    </div>
                    <div style={{ fontWeight:900, fontSize:15, color: h.pts>0?'#27AE60':'#E74C3C', flexShrink:0 }}>
                      {h.pts>0?'+':''}{h.pts.toLocaleString('id')}
                    </div>
                  </div>
                ))}
              </div>
              <div style={{ background:'#fff', borderRadius:16, padding:24, border:'1px solid rgba(0,0,0,.06)' }}>
                <h2 style={{ margin:'0 0 20px', fontSize:18, fontWeight:800 }}>Level Pengguna</h2>
                <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:12 }}>
                  {[
                    {n:'Bronze', min:0, max:499, color:'#CD7F32', icon:'🥉'},
                    {n:'Silver', min:500, max:1499, color:'#9E9E9E', icon:'🥈'},
                    {n:'Gold', min:1500, max:2999, color:'#F4C430', icon:'🥇'},
                    {n:'Platinum', min:3000, max:Infinity, color:'#8E8E8E', icon:'💎'},
                  ].map(l=>(
                    <div key={l.n} style={{ textAlign:'center', padding:16, borderRadius:12,
                      background: lvl===l.n?l.color+'22':'#f8f8f8',
                      border:`2px solid ${lvl===l.n?l.color:'transparent'}` }}>
                      <div style={{ fontSize:28, marginBottom:6 }}>{l.icon}</div>
                      <div style={{ fontWeight:800, fontSize:13 }}>{l.n}</div>
                      <div style={{ fontSize:10, color:MUT, marginTop:3 }}>
                        {l.max===Infinity?`${l.min.toLocaleString('id')}+`:`${l.min}–${l.max.toLocaleString('id')}`} poin
                      </div>
                      {lvl===l.n&&<div style={{ fontSize:10, color:l.color, fontWeight:800, marginTop:5 }}>Level Anda ✓</div>}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function PlaceholderPage({ title, icon }) {
      return (
        <div style={{ background:BG, minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center' }}>
          <div style={{ textAlign:'center', color:MUT }}>
            <div style={{ fontSize:64, marginBottom:16 }}>{icon}</div>
            <h2 style={{ fontSize:22, fontWeight:700, color:'#333', marginBottom:8 }}>{title}</h2>
            <p style={{ fontSize:14 }}>Halaman ini akan segera tersedia dalam versi berikutnya.</p>
          </div>
        </div>
      );
    }

    function App() {
      const [pg, setPg] = useState('home');
      const [pts, setPts] = useState(1250);
      const [selArt, setSelArt] = useState(null);
      const [readSet, setReadSet] = useState(new Set());
      const [streak, setStreak] = useState(0);
      const [redeemed, setRedeemed] = useState([]);
      const [notif, setNotif] = useState(null);
      const [history, setHistory] = useState(BASE_HISTORY);

      const notify = (msg, type='success') => {
        setNotif({msg, type});
        setTimeout(()=>setNotif(null), 3500);
      };

      const earn = (n, reason) => {
        setPts(p=>p+n);
        setHistory(h=>[{act:reason, pts:n, date:'Baru saja'}, ...h]);
        notify(`+${n} poin! ${reason}`);
      };

      const redeem = r => {
        if (pts < r.pts) { notify('Poin Anda tidak cukup untuk reward ini!', 'error'); return; }
        setPts(p=>p-r.pts);
        setRedeemed(arr=>[...arr, r]);
        notify(`Berhasil menukar: ${r.name}! 🎉`);
      };

      const go = id => {
        if (id !== 'article') window.scrollTo({top:0, behavior:'smooth'});
        setPg(id);
      };

      return (
        <div>
          {notif && <Notif n={notif} />}
          <NavBar pg={pg} go={go} pts={pts} />
          {pg==='home'      && <HomePage go={go} pts={pts} />}
          {pg==='articles'  && <ArticlesPage go={go} setArt={setSelArt} readSet={readSet} />}
          {pg==='article'   && selArt && (
            <ArticlePage art={selArt} readSet={readSet} setReadSet={setReadSet}
              earn={earn} streak={streak} setStreak={setStreak} go={go} />
          )}
          {pg==='rewards'   && <RewardsPage pts={pts} redeem={redeem} redeemed={redeemed} />}
          {pg==='dashboard' && <DashboardPage pts={pts} readSet={readSet} redeemed={redeemed} history={history} />}
          {pg==='programs'  && <PlaceholderPage title="Program Literasi" icon="🏫" />}
          {pg==='donate'    && <PlaceholderPage title="Donasi Literasi" icon="❤️" />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
